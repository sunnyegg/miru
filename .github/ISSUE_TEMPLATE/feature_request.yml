name: Feature Request
description: Suggest an idea for Miru
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. A clear problem statement and proposed solution help us evaluate it.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What problem does this solve? What workflow are you trying to improve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other approaches you thought about.
