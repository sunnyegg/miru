name: Bug Report
description: Report something that is not working
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Miru is in alpha — detailed reports help a lot.

        Find your Miru version in **Settings → About**.

  - type: input
    id: version
    attributes:
      label: Miru version
      description: Settings → About
      placeholder: e.g. 0.3.0 or dev
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: e.g. Ubuntu 24.04, Windows 11, macOS 15
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - Release binary
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Library
        - Playback / MPV
        - AniList
        - Search (Nyaa / Tokyo Toshokan)
        - Downloads / Torrents
        - Airing
        - Settings
        - Updates
        - UI / Window
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / terminal output
      description: If you can reproduce from a terminal, run Miru there and paste relevant output. Do not paste AniList tokens or magnet links.
      render: shell

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag and drop an image here, or paste a screenshot.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have redacted personal paths, tokens, and magnet links from this report
          required: true
