name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go fmt, lint, test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        run: npm --prefix frontend ci && npm --prefix frontend run build

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1

      - name: Test
        run: make test

  frontend:
    name: Frontend lint, typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint
        run: make lint-fe

      - name: Typecheck
        run: make typecheck
